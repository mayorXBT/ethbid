[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 256

[rpc_endpoints]
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
mainnet = "https://ethereum-rpc.publicnode.com"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
arbitrum = "https://arb1.arbitrum.io/rpc"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api", chain = 421614 }
arbitrum = { key = "${ARBISCAN_API_KEY}", url = "https://api.arbiscan.io/api", chain = 42161 }
